<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Game grid</title>
        <link rel="stylesheet" type="text/css" href="style.css">
    </head>
    <body>
        <div id="gamegrid"></div>    
        <div class="timer">
            <div id="totaltimer">total time:180s</div>
            <div id="individualtimer">turn time:15s</div>
        </div>
        <div class="score-board">
    <div style="color: blue;">Blue Score: <span id="blueS">0</span></div>
    
    <div style="color: red;">Red Score: <span id="redS">0</span></div>
</div>
        <script src="script.js"></script>
    </body>
</html>
